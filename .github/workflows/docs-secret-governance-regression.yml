name: Docs secret governance regression

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "scripts/ci/check-docs-secrets.mjs"
      - "scripts/ci/__tests__/check-docs-secrets.test.mjs"
      - ".github/workflows/docs-secret-governance-regression.yml"
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/ci/check-docs-secrets.mjs"
      - "scripts/ci/__tests__/check-docs-secrets.test.mjs"
      - ".github/workflows/docs-secret-governance-regression.yml"

permissions:
  contents: read

jobs:
  docs-secret-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run scanner regression tests
        run: node --test scripts/ci/__tests__/check-docs-secrets.test.mjs
      - name: Scan all documentation with redacted diagnostics
        run: node scripts/ci/check-docs-secrets.mjs
