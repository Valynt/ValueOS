name: Migration chain integrity

# Verifies that the active migration chain applies cleanly from a blank
# Postgres database with no manual pre-steps. Catches:
#   - Missing table dependencies (tables referenced but not created)
#   - Index references to non-existent tables or columns
#   - RLS policies that reference missing functions
#   - Any SQL syntax error in a migration file
#
# Runs on PRs and pushes that touch migrations or this workflow, and nightly on main.

on:
  pull_request:
    paths:
      - "infra/supabase/supabase/migrations/**"
      - "scripts/ci/check-active-migration-seeds.mjs"
      - "scripts/ci/*migration-versions*"
      - "scripts/ci/*value-modeling-scope*"
      - "scripts/ci/*billing-scope*"
      - "scripts/ci/*deal-assembly-scope*"
      - "scripts/ci/test-academy-reference.mjs"
      - "scripts/ci/local-postgres-safety.mjs"
      - "scripts/ci/test-membership-authorization.mjs"
      - "scripts/ci/fixtures/value-modeling-scope.sql"
      - "scripts/ci/__tests__/**"
      - ".github/workflows/migration-chain-integrity.yml"
  push:
    branches: [main, develop]
    paths:
      - "infra/supabase/supabase/migrations/**"
      - "scripts/ci/check-active-migration-seeds.mjs"
      - "scripts/ci/*migration-versions*"
      - "scripts/ci/*value-modeling-scope*"
      - "scripts/ci/*billing-scope*"
      - "scripts/ci/*deal-assembly-scope*"
      - "scripts/ci/test-academy-reference.mjs"
      - "scripts/ci/local-postgres-safety.mjs"
      - "scripts/ci/test-membership-authorization.mjs"
      - "scripts/ci/fixtures/value-modeling-scope.sql"
      - "scripts/ci/__tests__/**"
      - ".github/workflows/migration-chain-integrity.yml"
  schedule:
    # Nightly at 03:00 UTC — catches drift even when no migration PRs are open.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: migration-integrity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-integrity:
    name: Unique Supabase migration versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify version collision detector
        run: node --test scripts/ci/__tests__/check-migration-versions.test.mjs
      - name: Reject duplicate versions and capture exact inventory
        run: node scripts/ci/check-migration-versions.mjs --inventory > migration-version-inventory.json
      - name: Retain inventory even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-version-inventory
          path: migration-version-inventory.json
          if-no-files-found: error

  clean-apply:
    name: Clean apply from zero
    runs-on: ubuntu-latest

    services:
      postgres:
        # The pgvector extension must be installed inside the DB container,
        # not merely in the runner. Use the PG15-compatible pgvector image.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valueos_test
          PGUSER: postgres
          PGDATABASE: valueos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/valueos_test
      MIGRATIONS_DIR: infra/supabase/supabase/migrations

    steps:
      - uses: actions/checkout@v6

      - name: Install Postgres client and required extensions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # This must fail when the database server lacks an extension.
          # Suppressing this error would mask a broken migration environment.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          SQL

      - name: Stub Supabase auth roles and functions
        # Bare Postgres has no Supabase roles or auth schema. Recreate only
        # the compatibility surface referenced by the active migrations.
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                CREATE ROLE service_role NOLOGIN;
              END IF;
            END
            $$;

            CREATE SCHEMA IF NOT EXISTS auth;
            GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;

            -- Test-only minimal Supabase Auth *schema* contract; production
            -- migrations must never create/fabricate auth identities.
            -- Real Supabase integration tests remain a separate release gate.
            CREATE TABLE auth.users (
              id uuid PRIMARY KEY
            );

            CREATE OR REPLACE FUNCTION auth.uid()
            RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

            CREATE OR REPLACE FUNCTION auth.jwt()
            RETURNS jsonb
            LANGUAGE sql STABLE
            AS $$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;

            CREATE OR REPLACE FUNCTION auth.role()
            RETURNS text
            LANGUAGE sql STABLE
            AS $$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claim.role', true), ''), 'anon')::text $$;
          SQL

      - name: Verify active-migration seed guard against bypass fixtures
        run: node --test scripts/ci/__tests__/check-active-migration-seeds.test.mjs

      - name: Verify local seed destination cannot be redirected remotely
        run: bash scripts/db/__tests__/seed-local-demo.test.sh

      - name: Reject development seeds in active migrations
        run: node scripts/ci/check-active-migration-seeds.mjs

      - name: Verify authenticated membership self-promotion and enrollment are denied
        run: node scripts/ci/test-membership-authorization.mjs

      - name: Reject libpq routing overrides in disposable database runners
        run: node --test scripts/ci/__tests__/local-postgres-safety.test.mjs

      - name: Verify fresh and populated value-modeling scope repairs
        run: node scripts/ci/test-value-modeling-scope.mjs

      - name: Verify fresh and populated billing compatibility, RLS, and rollback
        run: node scripts/ci/test-billing-scope.mjs

      - name: Verify deal assembly historical contracts, populated upgrade, RLS and rollback
        run: node scripts/ci/test-deal-assembly-scope.mjs

      - name: Verify academy reference schema, RLS, legacy enum rejection and rollback
        run: node scripts/ci/test-academy-reference.mjs

      - name: Apply active migrations in order
        run: |
          set -euo pipefail

          MIGRATIONS_DIR="${{ env.MIGRATIONS_DIR }}"
          DB="${{ env.DATABASE_URL }}"
          FAILED=0

          echo "Applying migrations from: $MIGRATIONS_DIR"
          echo ""

          # Apply only top-level .sql files (not rollbacks, not _deferred/, not _archived/)
          # Sort by filename (timestamp order).
          while IFS= read -r -d '' migration; do
            filename=$(basename "$migration")

            # Skip rollback files
            if [[ "$filename" == *.rollback.sql ]]; then
              echo "  skip (rollback): $filename"
              continue
            fi

            echo "  applying: $filename"
            if ! PGPASSWORD=postgres psql "$DB" -v ON_ERROR_STOP=1 -f "$migration" > /tmp/migration_output.txt 2>&1; then
              echo ""
              echo "FAILED: $filename"
              cat /tmp/migration_output.txt
              FAILED=1
              break
            fi

            # Verify the canonical identity boundary on the actual migrated
            # schema before applying downstream user-FK migrations. Transaction
            # fixtures roll back; any negative RLS/FK assertion is fatal.
            if [[ "$filename" == "20260317010000_canonical_public_users_identity.sql" ]]; then
              echo "  verifying: canonical identity UUID/FK/RLS negative tests"
              if ! PGPASSWORD=postgres psql "$DB" -X -v ON_ERROR_STOP=1 \
                  -f scripts/ci/verify-canonical-users.sql; then
                echo "FAILED: canonical users identity contract"
                FAILED=1
                break
              fi
            fi
            if [[ "$filename" == "20260321010000_dsr_erase_user_pii_rpc.sql" ]]; then
              echo "  verifying: privileged DSR negative authorization tests"
              if ! PGPASSWORD=postgres psql "$DB" -X -v ON_ERROR_STOP=1 \
                  -f scripts/ci/verify-dsr-authorization.sql; then
                echo "FAILED: tenant-scoped DSR authorization contract"
                FAILED=1
                break
              fi
            fi
            if [[ "$filename" == "20261105000000_canonical_identity_security_reconciliation.sql" ]]; then
              echo "  verifying: final UUID/RLS and DSR authorization after forward reconciliation"
              if ! PGPASSWORD=postgres psql "$DB" -X -v ON_ERROR_STOP=1 \
                  -f scripts/ci/verify-canonical-users.sql \
                  -f scripts/ci/verify-dsr-authorization.sql; then
                echo "FAILED: final canonical identity security contract"
                FAILED=1
                break
              fi
            fi
          done < <(find "$MIGRATIONS_DIR" -maxdepth 1 -name "*.sql" -print0 | sort -z)

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Migration chain is broken. A fresh database cannot be provisioned."
            exit 1
          fi

          echo ""
          echo "All migrations applied successfully."

      - name: Verify load-bearing tables exist
        # These are the tables that active migrations reference but don't create —
        # they must now exist from the canonical baseline migration.
        run: |
          set -euo pipefail
          DB="${{ env.DATABASE_URL }}"

          REQUIRED_TABLES=(
            tenants
            user_tenants
            memberships
            value_cases
            agent_memory
            billing_customers
            subscriptions
            invoices
            webhook_events
            audit_logs
            security_audit_log
          )

          MISSING=0
          for table in "${REQUIRED_TABLES[@]}"; do
            count=$(PGPASSWORD=postgres psql "$DB" -t -c \
              "SELECT COUNT(*) FROM information_schema.tables
               WHERE table_schema = 'public' AND table_name = '$table';" | tr -d ' ')
            if [ "$count" -eq 0 ]; then
              echo "MISSING TABLE: $table"
              MISSING=1
            else
              echo "  ok: $table"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "Required tables are missing after clean apply."
            exit 1
          fi

      - name: Verify security schema and RLS functions exist
        run: |
          set -euo pipefail
          DB="${{ env.DATABASE_URL }}"

          # security.user_has_tenant_access must exist — all active RLS policies call it.
          count=$(PGPASSWORD=postgres psql "$DB" -t -c \
            "SELECT COUNT(*) FROM pg_proc p
             JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'security'
               AND p.proname = 'user_has_tenant_access';" | tr -d ' ')

          if [ "$count" -lt 2 ]; then
            echo "MISSING: security.user_has_tenant_access (expected TEXT and UUID overloads, found $count)"
            exit 1
          fi
          echo "  ok: security.user_has_tenant_access ($count overloads)"

      - name: Verify RLS is enabled on tenant-scoped tables
        run: |
          set -euo pipefail
          DB="${{ env.DATABASE_URL }}"

          # These tables must have RLS enabled after a clean apply.
          REQUIRED_RLS=(
            tenants
            user_tenants
            memberships
            value_cases
            agent_memory
            audit_logs
            security_audit_log
            semantic_memory
            hypothesis_outputs
            financial_model_snapshots
            integrity_outputs
            narrative_drafts
            realization_reports
            expansion_opportunities
            saga_transitions
            workflow_checkpoints
            value_loop_events
          )

          MISSING_RLS=0
          for table in "${REQUIRED_RLS[@]}"; do
            rls=$(PGPASSWORD=postgres psql "$DB" -t -c \
              "SELECT rowsecurity FROM pg_tables
               WHERE schemaname = 'public' AND tablename = '$table';" | tr -d ' ')
            if [ "$rls" != "t" ]; then
              echo "RLS NOT ENABLED: $table (rowsecurity=$rls)"
              MISSING_RLS=1
            else
              echo "  ok: $table"
            fi
          done

          if [ "$MISSING_RLS" -eq 1 ]; then
            echo ""
            echo "One or more tenant-scoped tables are missing RLS."
            exit 1
          fi

      - name: Verify indexes reference real columns
        # Catches the class of bug where a performance index was added for a
        # column that doesn't exist on the table (e.g., tenant_id on a table
        # that only has organization_id).
        run: |
          set -euo pipefail
          DB="${{ env.DATABASE_URL }}"

          INVALID=$(PGPASSWORD=postgres psql "$DB" -t -c "
            SELECT
              n.nspname || '.' || t.relname AS table_name,
              i.relname                     AS index_name,
              a.attname                     AS column_name
            FROM pg_index ix
            JOIN pg_class  t ON t.oid = ix.indrelid
            JOIN pg_class  i ON i.oid = ix.indexrelid
            JOIN pg_namespace n ON n.oid = t.relnamespace
            -- Unnest the index key attribute numbers
            JOIN LATERAL unnest(ix.indkey) AS k(attnum) ON true
            -- Left join to find columns that don't exist
            LEFT JOIN pg_attribute a
              ON a.attrelid = ix.indrelid AND a.attnum = k.attnum
            WHERE n.nspname = 'public'
              AND k.attnum > 0
              AND a.attname IS NULL
            ORDER BY table_name, index_name;
          " | grep -v "^$" || true)

          if [ -n "$INVALID" ]; then
            echo "Indexes referencing non-existent columns:"
            echo "$INVALID"
            exit 1
          fi
          echo "  ok: all indexes reference valid columns"

      - name: Verify compute_portfolio_value is not SECURITY DEFINER
        # Ensures the security patch (20260328000000) is in effect.
        run: |
          set -euo pipefail
          DB="${{ env.DATABASE_URL }}"

          sec_def=$(PGPASSWORD=postgres psql "$DB" -t -c \
            "SELECT prosecdef FROM pg_proc p
             JOIN pg_namespace n ON n.oid = p.pronamespace
             WHERE n.nspname = 'public'
               AND p.proname = 'compute_portfolio_value'
             LIMIT 1;" | tr -d ' ')

          if [ "$sec_def" = "t" ]; then
            echo "SECURITY VIOLATION: compute_portfolio_value is still SECURITY DEFINER."
            echo "The cross-tenant exposure patch (20260328000000) was not applied."
            exit 1
          fi
          echo "  ok: compute_portfolio_value is SECURITY INVOKER"
