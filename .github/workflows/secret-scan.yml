name: Secret Scan

# Runs on every PR (incremental diff) and on pushes to main (full history).
# The full-history job is the enforcement backstop: it catches secrets that
# were committed in any ancestor commit, not just the current diff.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_depth:
        description: "Number of commits to scan (0 = full history)"
        required: false
        default: "0"
        type: string

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  # ── Incremental scan (PR diff only) ─────────────────────────────────────────
  gitleaks-diff:
    name: gitleaks / diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history to diff against the base branch
          fetch-depth: 0

      - name: Run gitleaks on PR diff
        run: bash scripts/ci/run-gitleaks-scan.sh diff artifacts/secret-scan/gitleaks-diff.sarif

      - name: Upload SARIF (diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: artifacts/secret-scan/gitleaks-diff.sarif
          name: gitleaks-diff
          if-no-files-found: error

  # ── Full-history scan (main push + manual) ───────────────────────────────────
  gitleaks-history:
    name: gitleaks / full-history
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for deep scanning
          fetch-depth: ${{ github.event.inputs.scan_depth == '0' && 0 || github.event.inputs.scan_depth || 0 }}

      - name: Scan full git history with Gitleaks CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts/secret-scan
          bash scripts/ci/run-gitleaks-scan.sh history artifacts/secret-scan/gitleaks-history.sarif 2>&1 | tee artifacts/secret-scan/gitleaks-history.log

      - name: Upload SARIF (history)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: artifacts/secret-scan/gitleaks-history.sarif
          name: gitleaks-history
          if-no-files-found: error

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-history-${{ github.run_id }}
          path: artifacts/secret-scan/
          if-no-files-found: warn
          retention-days: 365

  # ── Gate: both jobs must pass before merge ───────────────────────────────────
  secret-scan-gate:
    name: secret-scan-gate
    runs-on: ubuntu-latest
    needs: [gitleaks-diff]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Evaluate scan results
        run: |
          DIFF_STATUS="${{ needs.gitleaks-diff.result }}"
          if [ "$DIFF_STATUS" != "success" ]; then
            echo "FAIL: gitleaks-diff=$DIFF_STATUS"
            exit 1
          fi
          echo "Secret scan gate: PASS"
